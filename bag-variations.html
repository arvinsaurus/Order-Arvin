<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Bag Variations — Order Crazy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:radial-gradient(circle at 20% 0%,rgba(255,210,63,.10),transparent 32%),radial-gradient(circle at 80% 12%,rgba(78,205,196,.10),transparent 34%),linear-gradient(180deg,#10101b 0%,#08080f 58%,#050509 100%);color:#fff;font-family:'Outfit',sans-serif}
body{padding:28px 20px 40px}
.wrap{max-width:960px;margin:0 auto}
h1{font-family:'Fredoka',sans-serif;font-size:28px;color:#ffd23f;letter-spacing:-.5px;margin-bottom:6px}
.sub{color:rgba(255,255,255,.5);font-size:13px;max-width:560px;line-height:1.5;margin-bottom:24px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border-radius:14px;padding:16px;
  box-shadow:0 20px 36px -18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
  cursor:pointer;transition:border-color .2s,transform .2s;
}
.card:hover{border-color:rgba(255,210,63,.22);transform:translateY(-2px)}
.card .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:8px}
.card .name{font-weight:700;font-size:14px}
.card .tag{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.4px}
.stage{
  border-radius:10px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 95%,rgba(255,210,63,.04) 0%,transparent 60%),linear-gradient(180deg,#1c1c2c 0%,#0e0e18 100%);
  border:1px solid rgba(255,255,255,.04);
  padding:20px 10px 16px;
  display:flex;justify-content:center;gap:10px;align-items:flex-end;min-height:80px;
}
.notes{margin-top:12px;font-size:11px;color:rgba(255,255,255,.4);line-height:1.5}
</style>
</head>
<body>
<main class="wrap">
  <h1>Shopping Bag Variations</h1>
  <p class="sub">All use a white base with the liquid color as the accent. Shown at actual game size with 4 sample colors.</p>
  <div class="grid" id="grid"></div>
</main>

<script>
const C=[
  {n:'Red',f:'#E63946',m:'#c1272d',d:'#7a1118',l:'#ff7a7a',s:'#ffb3b3'},
  {n:'Blue',f:'#4361EE',m:'#3350cc',d:'#1e2e80',l:'#7b93f5',s:'#b8c8ff'},
  {n:'Purple',f:'#9B5DE5',m:'#7a3dc0',d:'#4c2480',l:'#be8ff5',s:'#dcc5ff'},
  {n:'Green',f:'#2DC653',m:'#22a040',d:'#15662a',l:'#5edb7a',s:'#aef0be'},
];

function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// Bottle silhouette as an inline SVG (simple iconic shape matching the reference)
function bottleSVG(color,w=12,h=18){
  return `<svg width="${w}" height="${h}" viewBox="0 0 12 18" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="4" y="0" width="4" height="3" rx="1" fill="${color}"/>
    <path d="M3.5 3.5 C3.5 3.5 2 5.5 2 7 L2 16 C2 17 2.8 17.5 3.5 17.5 L8.5 17.5 C9.2 17.5 10 17 10 16 L10 7 C10 5.5 8.5 3.5 8.5 3.5 Z" fill="${color}"/>
  </svg>`;
}

// ══════════════════════════════════════
// VARIATION DEFINITIONS
// ══════════════════════════════════════
const variations = [
  {
    name:'1. Clean Label',
    tag:'like the reference',
    notes:'White bag, colored handle, bottle silhouette centered. Closest to your reference image.',
    render(c, done){
      return `
        <div style="display:flex;flex-direction:column;align-items:center;width:36px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25))">
          <!-- Handle -->
          <div style="width:16px;height:9px;border:2.5px solid ${done?'#38B000':c.f};border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-1px"></div>
          <!-- Bag body -->
          <div style="width:32px;height:30px;border-radius:1px 1px 5px 5px;background:linear-gradient(180deg,#f5f5f7,#e8e8ec);border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
            <!-- Left edge highlight -->
            <div style="position:absolute;top:0;left:0;width:5px;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.6),transparent)"></div>
            <!-- Right shadow -->
            <div style="position:absolute;top:0;right:0;width:6px;height:100%;background:linear-gradient(270deg,rgba(0,0,0,.08),transparent)"></div>
            <!-- Fold line -->
            <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(180deg,rgba(0,0,0,.1),transparent)"></div>
            <!-- Bottle icon -->
            ${bottleSVG(done?'#38B000':c.f)}
            ${done?`<div style="position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#38B000;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;box-shadow:0 2px 5px rgba(56,176,0,.4)">✓</div>`:''}
          </div>
        </div>`;
    }
  },
  {
    name:'2. Color Strip',
    tag:'side accent',
    notes:'White bag with a bold vertical color strip on the left side. Minimal and clean.',
    render(c, done){
      return `
        <div style="display:flex;flex-direction:column;align-items:center;width:36px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25))">
          <div style="width:16px;height:9px;border:2.5px solid ${done?'#38B000':c.f};border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-1px"></div>
          <div style="width:32px;height:30px;border-radius:1px 1px 5px 5px;background:linear-gradient(180deg,#f5f5f7,#e8e8ec);border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;position:relative;overflow:hidden">
            <!-- Color strip -->
            <div style="position:absolute;top:0;left:0;width:7px;height:100%;background:linear-gradient(180deg,${c.l},${c.f});border-radius:0 0 0 4px"></div>
            <!-- Fold line -->
            <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent)"></div>
            <!-- Right shadow -->
            <div style="position:absolute;top:0;right:0;width:5px;height:100%;background:linear-gradient(270deg,rgba(0,0,0,.06),transparent)"></div>
            <!-- Bottle icon (shifted right) -->
            <div style="margin-left:auto;margin-right:5px">${bottleSVG(done?'#38B000':c.f,10,15)}</div>
            ${done?`<div style="position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#38B000;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;box-shadow:0 2px 5px rgba(56,176,0,.4)">✓</div>`:''}
          </div>
        </div>`;
    }
  },
  {
    name:'3. Bottom Fill',
    tag:'liquid rising',
    notes:'White bag with the bottom portion filled in the liquid color — looks like the bag is being filled from the bottom up.',
    render(c, done){
      return `
        <div style="display:flex;flex-direction:column;align-items:center;width:36px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25))">
          <div style="width:16px;height:9px;border:2.5px solid ${done?'#38B000':c.f};border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-1px"></div>
          <div style="width:32px;height:30px;border-radius:1px 1px 5px 5px;background:linear-gradient(180deg,#f5f5f7,#ededf0);border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
            <!-- Bottom color fill -->
            <div style="position:absolute;bottom:0;left:0;right:0;height:14px;background:linear-gradient(180deg,${c.l},${c.f});border-radius:0 0 4px 4px"></div>
            <!-- Left highlight -->
            <div style="position:absolute;top:0;left:0;width:5px;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.5),transparent)"></div>
            <!-- Fold -->
            <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent)"></div>
            <!-- Bottle icon (white on color) -->
            ${bottleSVG(done?'#fff':'rgba(255,255,255,.85)',10,14)}
            ${done?`<div style="position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#38B000;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;box-shadow:0 2px 5px rgba(56,176,0,.4)">✓</div>`:''}
          </div>
        </div>`;
    }
  },
  {
    name:'4. Color Dot',
    tag:'minimal badge',
    notes:'Clean white bag with just a colored circle badge showing the target color. Most minimal option.',
    render(c, done){
      return `
        <div style="display:flex;flex-direction:column;align-items:center;width:36px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25))">
          <div style="width:16px;height:9px;border:2.5px solid ${done?'#38B000':c.f};border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-1px"></div>
          <div style="width:32px;height:30px;border-radius:1px 1px 5px 5px;background:linear-gradient(180deg,#f5f5f7,#e8e8ec);border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
            <!-- Left highlight -->
            <div style="position:absolute;top:0;left:0;width:5px;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.5),transparent)"></div>
            <!-- Fold -->
            <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent)"></div>
            <!-- Right shadow -->
            <div style="position:absolute;top:0;right:0;width:5px;height:100%;background:linear-gradient(270deg,rgba(0,0,0,.06),transparent)"></div>
            <!-- Color circle -->
            <div style="width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,${c.l},${c.f});box-shadow:0 2px 6px ${hexToRgba(c.f,.35)};border:1px solid ${hexToRgba(c.f,.2)}"></div>
            ${done?`<div style="position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#38B000;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;box-shadow:0 2px 5px rgba(56,176,0,.4)">✓</div>`:''}
          </div>
        </div>`;
    }
  },
  {
    name:'5. Full Wrap',
    tag:'bold color band',
    notes:'White bag with a wide horizontal color band across the center. The bottle icon sits inside the band in white.',
    render(c, done){
      return `
        <div style="display:flex;flex-direction:column;align-items:center;width:36px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25))">
          <div style="width:16px;height:9px;border:2.5px solid ${done?'#38B000':c.f};border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-1px"></div>
          <div style="width:32px;height:30px;border-radius:1px 1px 5px 5px;background:linear-gradient(180deg,#f5f5f7,#e8e8ec);border:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
            <!-- Color band across center -->
            <div style="position:absolute;top:6px;left:0;right:0;height:18px;background:linear-gradient(180deg,${c.l},${c.f})"></div>
            <!-- Left highlight -->
            <div style="position:absolute;top:0;left:0;width:5px;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.35),transparent);z-index:1"></div>
            <!-- Fold -->
            <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(180deg,rgba(0,0,0,.08),transparent);z-index:1"></div>
            <!-- Bottle icon (white) -->
            <div style="position:relative;z-index:1">${bottleSVG('#fff',10,14)}</div>
            ${done?`<div style="position:absolute;bottom:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#38B000;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;box-shadow:0 2px 5px rgba(56,176,0,.4);z-index:2">✓</div>`:''}
          </div>
        </div>`;
    }
  },
];

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
const grid = document.getElementById('grid');

variations.forEach(v => {
  const card = document.createElement('div');
  card.className = 'card';

  // Render 4 colors as pending + 1 as done
  let bagHTML = '';
  C.forEach((c,i) => {
    bagHTML += v.render(c, false);
  });
  // Also show one "done" state
  bagHTML += v.render(C[0], true);

  card.innerHTML = `
    <div class="head">
      <span class="name">${v.name}</span>
      <span class="tag">${v.tag}</span>
    </div>
    <div class="stage">${bagHTML}</div>
    <div class="notes">${v.notes}</div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
